# Backend project metadata (PEP 621).
#
# Vercel's Python runtime builds this project with `uv`. `uv` requires a
# `[project]` table -- without it the build fails immediately with
# "No `project` table found in backend/pyproject.toml", because there is
# nothing to resolve. The `[project]` table below is therefore load-bearing for
# the deployment, and the pinned dependency list is kept byte-for-byte in sync
# with `requirements.txt`, which the Dockerfile still installs.
#
# This is an application, not a library: there is no importable distribution to
# build (`app/` is the source tree, not a package to publish). `[tool.uv]
# package = false` states that explicitly, so `uv lock` / `uv sync` resolve and
# install dependencies only and never try to build a wheel for the project.

[project]
name = "bhumi-abhilekh-backend"
version = "1.0.0"
description = "Intelligent Land Record Digitization & Validation System - FastAPI backend"
# 3.12 matches the interpreter in `venv312`, the `python:3.12-slim` base image
# and `target-version = "py312"` under [tool.ruff]. Pinned to 3.12 so Vercel
# cannot silently resolve a different minor with different wheels.
requires-python = ">=3.12,<3.13"
dependencies = [
    # ── Web framework ──────────────────────────────────────────────────────────
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.12",   # FastAPI File()/Form() upload parsing
    "slowapi==0.1.9",             # rate limiting middleware
    "aiofiles==24.1.0",

    # ── Settings / validation ──────────────────────────────────────────────────
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "email-validator==2.2.0",     # pydantic EmailStr validation
    "python-dotenv==1.0.1",

    # ── Auth ───────────────────────────────────────────────────────────────────
    "python-jose[cryptography]==3.3.0",
    # passlib 1.7.4 is incompatible with bcrypt >= 4.1 (it raises on its own
    # startup probe for passwords over 72 bytes), so bcrypt is used directly.
    "bcrypt==4.0.1",

    # ── Data stores ────────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",            # postgresql+asyncpg driver
    "alembic==1.13.2",
    "redis[hiredis]==5.1.0",      # job queue / status store
    "motor==3.6.0",               # async MongoDB (audit trail, pipeline log)
    "pymongo==4.9.1",

    # ── HTTP client ────────────────────────────────────────────────────────────
    "httpx==0.27.2",

    # ── OCR / Document Processing ──────────────────────────────────────────────
    # These are required, not optional: the pipeline performs real OCR and the
    # service fails the OCR stage outright rather than returning synthetic text.
    #
    # System packages (installed separately, NOT pip):
    #   Debian/Ubuntu : apt-get install -y tesseract-ocr tesseract-ocr-hin poppler-utils
    #   Alpine        : apk add tesseract tesseract-data-hin poppler-utils
    #   macOS         : brew install tesseract poppler tesseract-lang
    #   Windows       : choco install tesseract poppler
    # Hindi language data is required for Devanagari documents:
    #   https://github.com/tesseract-ocr/tessdata/raw/main/hi.traineddata
    "pytesseract==0.3.13",
    "pdf2image==1.17.0",
    "pillow==10.4.0",
    "numpy==1.26.4",
]

# Test/dev tooling. Mirrors `requirements-test.txt`.
#
# Declared as an *extra*, not a PEP 735 dependency group, on purpose: `uv sync`
# installs the `dev` group by default, so a group would drag pytest, ruff and
# the pyrefly binary into a Vercel build and blow past the function size limit
# for code that is never imported at runtime. Extras are opt-in, so the deploy
# install stays lean:
#
#   uv sync                  # runtime dependencies only (what Vercel runs)
#   uv sync --extra test     # local development and CI
#   uv run --extra test pytest
[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "fakeredis>=2.20",
    "pyrefly>=1.3.2",
    "ruff>=0.16.0",
    "types-python-jose>=3.3.0",
]

[tool.uv]
# Application project: resolve and install dependencies, do not build/install
# the project itself. See the note at the top of this file.
package = false

# ── Type checking ─────────────────────────────────────────────────────────────
[tool.pyrefly]
# backend/ is the Python project root: `app`, `tests` and the Alembic
# migration scripts all import each other as top-level modules from here.
project-includes = ["app/**/*.py", "tests/**/*.py", "alembic/**/*.py"]
project-excludes = ["venv312/**", ".venv/**", ".pytest_cache/**", "**/__pycache__/**"]
# Only first-party code lives here. Third-party packages are resolved from
# site-packages, never from this path -- otherwise local directories such as
# `alembic/` would shadow the installed `alembic` distribution.
search-path = ["."]
python-version = "3.12"
python-interpreter-path = "venv312/Scripts/python.exe"
output-format = "min-text"

[tool.ruff]
target-version = "py312"
src = ["app", "tests"]
# `venv312` (local dev) and `.venv` (uv) hold site-packages that re-export many
# vendored modules; scanning either produces thousands of findings that are not
# this project's code.
extend-exclude = ["venv312", ".venv", "alembic"]

[tool.ruff.lint]
# Only defect classes are enforced. Style/modernisation rules are deliberately not
# selected: this codebase standardises on `Optional[X]` (not PEP 604 `X | None`)
# and on import order that is not isort-canonical, so flagging those would report
# ~250 findings that contradict the established conventions.
select = ["E4", "E7", "E9", "F", "B"]
# E712 is a false positive throughout this ORM codebase: `Model.column == True`
# is SQLAlchemy building a SQL expression, not a Python truth check. Ruff's
# suggested rewrite (`where(Model.column)`) would change the query's meaning.
# Every other E7 rule stays enabled.
ignore = ["E712"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection declarations *are* the documented way to express
# defaults; B008 cannot tell them apart from genuinely unsafe mutable defaults.
# Listing them here teaches the rule about those calls instead of hiding findings.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]
